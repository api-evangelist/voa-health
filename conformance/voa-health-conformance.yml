method: searched
source: >-
  https://docs.voa.health/integracao/rnds/como-funciona.md and
  https://docs.voa.health/integracao/rnds/endpoints.md (FHIR R4, ICP-Brasil
  mTLS, TLS 1.2+, LGPD claims) plus derivation from openapi/*.yml
