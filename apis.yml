name: VOA Health
description: >-
  Voa is a Brazilian healthcare-technology company providing an AI clinical
  documentation and patient-monitoring assistant that embeds directly into
  electronic patient record (EHR/PEP) systems, used by 60,000+ physicians across
  1M+ consultations. Voa exposes integration surfaces — an embeddable plugin, an
  iFrame widget, and a browser extension — plus a REST integration API and an
  RNDS API that submits finalized clinical records to Brazil's Rede Nacional de
  Dados em Saúde (national health data network) in FHIR R4 using ICP-Brasil
  certificate authentication. Backed by Prosus Ventures.
